name: Build and Release

on:
  push:
    branches:
      - wip
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        include-prerelease: true

    # Server Build
    - name: Build Server
      run: |
        dotnet publish source/MiaoNet.Server/MiaoNet.Server.csproj -c Release -o output/server

    - name: Zip Server
      run: |
        Compress-Archive -Path output/server/* -DestinationPath MiaoNet.Server.zip

    # Client Build
    # Note: Client build requires Celeste game files. 
    # We attempt to point dependencies to a local 'lib' folder.
    # User must ensure these DLLs exist or are cached.
    - name: Setup Client Dependencies
      run: |
        # Create a lib directory if it doesn't exist (User needs to populate this via repo or cache)
        if (!(Test-Path lib)) { New-Item -ItemType Directory -Path lib }
        
        # Mock Celeste.exe and Celeste.Mod.mm.dll to bypass CelesteMod.targets checks
        # The build only needs the DLLs referenced in .csproj (Celeste.dll, FNA.dll, etc.)
        if (!(Test-Path lib/Celeste.exe)) { New-Item -Path lib/Celeste.exe -ItemType File }
        if (!(Test-Path lib/Celeste.Mod.mm.dll)) { New-Item -Path lib/Celeste.Mod.mm.dll -ItemType File }

        Write-Host "Ensure Celeste.dll, FNA.dll, etc. are in ./lib/"

    - name: Build Client
      run: |
        cd source/MiaoNet.Client
        # Override CelesteRootPath property to point to the root/lib folder
        # Note: ..\..\lib resolves to the lib folder created in root
        # Use absolute path for CelesteRootPath to avoid relative path confusion in MSBuild
        $root = (Get-Item ..\..).FullName
        $libPath = Join-Path $root "lib"
        
        # Override ModAssetsCopyType to 'copy' to avoid symbolic link creation (mklink requires Admin privileges)
        dotnet build -c Release -p:CelesteRootPath=$libPath -p:ModAssetsCopyType=copy
        
        # Run the packaging script
        ./publishToZip.ps1

    - name: Locate Client Artifact
      id: client_artifact
      run: |
        $zip = Get-ChildItem "source/MiaoNet.Client/*.zip" | Select-Object -First 1
        echo "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

    # Release
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        files: |
          MiaoNet.Server.zip
          ${{ steps.client_artifact.outputs.path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
