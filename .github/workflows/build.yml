name: Build and Release

on:
  push:
    branches:
      - wip
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        include-prerelease: true

    # Server Build
    - name: Build Server
      run: |
        dotnet publish source/MiaoNet.Server/MiaoNet.Server.csproj -c Release -o output/server

    - name: Zip Server
      run: |
        Compress-Archive -Path output/server/* -DestinationPath MiaoNet.Server.zip

    # Client Build
    # Note: Client build requires Celeste game files. 
    # We attempt to point dependencies to a local 'lib' folder.
    # User must ensure these DLLs exist or are cached.
    - name: Setup Client Dependencies
      run: |
        # Create a lib directory if it doesn't exist (User needs to populate this via repo or cache)
        if (!(Test-Path lib)) { New-Item -ItemType Directory -Path lib }
        
        # Override the CelesteRootPath in the csproj/props to point to ./lib/
        # This is a temporary fix for CI. Ideally, use a .user file or environment variable.
        # Since props file has it hardcoded, we might need to rely on the build command override if possible,
        # but MSBuild properties in files usually override command line unless treated carefully.
        # We will attempt to build, but this step is expected to fail without user action (up~loading DLLs).
        Write-Host "Ensure Celeste.dll, FNA.dll, etc. are in ./lib/"

    - name: Build Client
      run: |
        cd source/MiaoNet.Client
        # Override CelesteRootPath property to point to the root/lib folder
        # Note: ..\..\lib resolves to the lib folder created in root
        dotnet build -c Release -p:CelesteRootPath=..\..\lib
        
        # Run the packaging script
        ./publishToZip.ps1

    - name: Locate Client Artifact
      id: client_artifact
      run: |
        $zip = Get-ChildItem "source/MiaoNet.Client/*.zip" | Select-Object -First 1
        echo "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

    # Release
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        files: |
          MiaoNet.Server.zip
          ${{ steps.client_artifact.outputs.path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
